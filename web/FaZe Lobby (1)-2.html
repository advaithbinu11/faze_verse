@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0e}}
:root[data-theme="dark"]{--bg:#0b0b0e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;margin:0;letter-spacing:.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:9px 14px;background:var(--red);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;font:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--red);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
header h1{font-size:28px}
.bal{font-family:Anton,Impact,sans-serif;font-size:30px;line-height:1;text-align:right}
.bal small{display:block;font:12px system-ui;color:var(--mute)}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
nav button{background:transparent;color:var(--mute);white-space:nowrap}
nav button.on{background:var(--panel);color:var(--text);box-shadow:inset 0 -3px var(--red)}
main{max-width:900px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:2px;padding:14px}
.card h3{font-size:22px;margin-bottom:4px}
.mute{color:var(--mute);font-size:13px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:99px;font-weight:500}
.chip.on{background:var(--red);border-color:var(--red)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:0 4px 4px 0;color:var(--mute)}
.match{font-family:Anton,Impact,sans-serif;font-size:24px;color:var(--ok)}
.conn{border-left:4px solid var(--line)}
.conn.on{border-left-color:var(--ok)}
.sec{margin:22px 0 10px;font-size:26px}
.post{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:6px;font-weight:600;z-index:9;max-width:90vw}
.tl{border-left:3px solid var(--red);padding-left:14px;margin-left:6px}
.tl .card{margin-bottom:10px}
.yr{font-family:Anton,Impact,sans-serif;color:var(--red);font-size:26px}
.price{font-family:Anton,Impact,sans-serif;font-size:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--red)}
.pc{background:#f4f4f6;color:#111;min-width:58px;font-size:20px;padding:12px 6px}.pc.on{outline:3px solid var(--ok)}
.felt{background:radial-gradient(ellipse at center,#12804a,#093d22);border:6px solid #3a2a14;border-radius:24px;padding:14px;color:#fff;display:grid;gap:12px}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seat{text-align:center;padding:8px;border-radius:10px;background:rgba(0,0,0,.28)}
.seat.act{outline:2px solid #ffc933}.seat.fold{opacity:.45}
.cd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:62px;margin:2px;border-radius:6px;background:#fff;color:#111;font:700 18px/1 system-ui}
.cd i{font-style:normal;font-size:20px}.cd.rd{color:#d4142e}
.cd.bk{background:repeating-linear-gradient(45deg,#b0001f,#b0001f 5px,#7e0016 5px,#7e0016 10px);border:2px solid #fff}
.cd.em{background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4)}

<body>
<header>
  <h1 style="display:flex;align-items:center;gap:10px"><span class="logo" role="img" aria-label="FaZe"></span><span>FaZe Lobby<small style="display:block;font:12px system-ui;color:var(--mute)">Run with your crew</small></span></h1>
  <div class="bal"><span id="bal">0</span> FaZe Points<small id="lvl"></small></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const S={tab:'welcome',frags:250,game:'All',q:'',conn:{steam:false,discord:false,riot:false},joined:[],claimed:[],bought:[],liked:[],unlocked:[],ok18:false,amt:25,r:{},pk:null,pos:[],
posts:[{u:'RugRat22',t:'Anyone got a Valorant 5-stack for tonight? Gold/Plat.',l:14},{u:'NukeSquadFan',t:'Found my old 2013 montage folder. Peak era.',l:31}]};
const SQUADS=[
{id:1,n:'Trickshot Reunion',g:'CoD',r:'Any',v:'Nostalgia',m:1240,d:'Quickscopes, 2012 style. Old heads and newcomers.'},
{id:2,n:'Nuke Squad Warzone',g:'CoD',r:'Mid',v:'Competitive',m:860,d:'Nightly Warzone trios.'},
{id:3,n:'Plat Push',g:'Valorant',r:'Plat',v:'Competitive',m:430,d:'Climbing together, VOD review on Sundays.'},
{id:4,n:'Casual Valorant',g:'Valorant',r:'Any',v:'Chill',m:980,d:'No tilt. Swiftplay and unrated.'},
{id:5,n:'CS2 Faceit Grind',g:'CS2',r:'High',v:'Competitive',m:610,d:'Level 7+ stack looking for a fifth.'},
{id:6,n:'Halo Infinite Nights',g:'Halo',r:'Any',v:'Chill',m:300,d:'Big Team Battle and customs.'},
{id:7,n:'League Flex Five',g:'LoL',r:'Gold',v:'Chill',m:520,d:'Flex queue, Discord on.'},
{id:8,n:'New to FaZe',g:'All',r:'Any',v:'Beginner',m:2100,d:'Learn the lore, meet the community.'}];
const GAMEAPI={Valorant:'riot',LoL:'riot',CS2:'steam',Halo:'steam',CoD:'steam',All:'discord'};
const QUESTS=[{id:'q1',t:'Join a squad',f:20,ok:()=>S.joined.length>0},{id:'q2',t:'Post to the feed',f:10,ok:()=>S.posts.some(p=>p.u==='You')},{id:'q3',t:'Connect an account',f:30,ok:()=>Object.values(S.conn).some(Boolean)},{id:'q4',t:'Watch a sponsor clip (HardScope quest)',f:40,ok:()=>true}];
const SHOP=[
{id:'s1',n:'Squad Banner',d:'Custom banner for your squad page.',f:150,usd:null},
{id:'s2',n:'OG Badge (2010 era)',d:'Profile badge for returning fans.',f:300,usd:null},
{id:'s3',n:'Tournament Entry',d:'Enter a community FaZe cup.',f:500,usd:null},
{id:'s4',n:'FaZe Hoodie Drop',d:'Limited merch, members get early access.',f:null,usd:64.99},
{id:'s5',n:'Cosmetic Pack',d:'Profile skins and badges.',f:null,usd:9.99},
{id:'s6',n:'Squad+ (monthly)',d:'2x Frags, private squads, watch parties.',f:null,usd:4.99},
{id:'s7',n:'Boost your squad',d:'Pin your squad to the top for a day.',f:200,usd:null}];
const VAULT=[
{y:2012,t:'1 million subscribers',d:'The celebration montage hit 12.1M views, still the most-watched FaZe video.',c:60},
{y:2013,t:'FaZe Rug joins',d:'Six months after starting his channel, he became the biggest individual YouTuber.',c:60},
{y:2019,t:'19M social followers',d:'More than the Cowboys and Yankees combined, per Forbes.',c:80},
{y:2020,t:'Swagg gets the offer live',d:'He brought the Nuke Squad with him.',c:80},
{y:2021,t:'Sports Illustrated cover',d:'First esports org on the cover, with Bronny James and Kyler Murray.',c:100},
{y:2022,t:'Snoop Dogg joins',d:'A board seat and a roster spot.',c:100}];
const $=s=>document.querySelector(s);
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const add=n=>{S.frags+=n;render()};
const lvl=()=>S.frags>=1500?'Legend':S.frags>=500?'Pro':S.frags>=150?'Rising':'Rookie';

/* Connector adapters. In production each calls a backend that holds the API keys. */
const CONN={
steam:{n:'Steam',d:'Owned games and playtime',data:'Top game: Counter-Strike 2, 1,240 hrs',how:'Steam OpenID login, then Web API GetOwnedGames'},
discord:{n:'Discord',d:'Servers and friends',data:'Found 6 servers, 14 friends on FaZe Lobby',how:'Discord OAuth2 scopes identify and guilds'},
riot:{n:'Riot',d:'Valorant and League rank',data:'Valorant: Platinum 2, League: Gold 4',how:'Riot Sign On (RSO), then Valorant and League APIs'}};

function match(s){let p=55+(s.id*7)%20;const a=GAMEAPI[s.g];if(S.conn[a])p+=20;if(S.conn.discord)p+=5;return Math.min(p,99)}

function tabs(){const T=['foryou','friends','squads','timeline','markets','shop'];const L={friends:'<i>💬</i>Friends',foryou:'<i>🏠</i>For you',squads:'<i>👥</i>Squads',timeline:'<i>📜</i>Timeline',markets:'<i>🎯</i>Predict',shop:'<i>🛍️</i>Shop',plus:'<i>⭐</i>Squad+'};
$('#nav').innerHTML=T.map(t=>`<button class="${S.tab===t?'on':''}" data-t="${t}">${L[t]}</button>`).join('');
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()})}

function squads(){
const G=['All','CS2','Valorant','CoD','Halo','LoL'];
let list=SQUADS.filter(s=>(S.game==='All'||s.g===S.game||s.g==='All')&&(s.n+s.d+s.v).toLowerCase().includes(S.q.toLowerCase()));
list.sort((a,b)=>match(b)-match(a));
return `<h2 class="sec" style="margin-top:0">Find your crew</h2>${S.open?create2():`<button id="mk">Pull up your own crew (free)</button>`}<h2 class="sec">Squads for you</h2>
<input id="q" placeholder="Search squads or vibes" value="${S.q}" aria-label="Search squads">
<div class="row" style="margin:10px 0">${G.map(g=>`<button class="chip ${S.game===g?'on':''}" data-g="${g}">${g}</button>`).join('')}</div>
${Object.values(S.conn).some(Boolean)?'':'<p class="mute">Connect Steam, Discord or Riot in Accounts to get real match scores.</p>'}
<div class="grid">${list.map(s=>{const j=S.joined.includes(s.id);return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${s.n}</h3><span class="match">${match(s)}%</span></div>
<span class="tag">${s.g}</span><span class="tag">${s.r}</span><span class="tag">${s.v}</span>
<p class="mute">${s.d}</p>${s.mine?`<div class="inv">Invite code <b>${s.code}</b><button class="ghost" data-cp="${s.code}">Copy invite</button></div>`:''}<div class="row" style="justify-content:space-between"><span class="mute">${(s.m+(j?1:0)).toLocaleString()} members</span>
<button data-j="${s.id}" class="${j?'ghost':''}">${j?'Joined':'Join squad'}</button></div></div>`}).join('')||'<p class="mute">No squads match. Clear the search or pick another game.</p>'}</div>`}

function create(){const o=a=>a.map(x=>`<option>${x}</option>`).join('');return `<div class="card" style="display:grid;gap:8px"><h3>New squad</h3><input id="cn" placeholder="Squad name" maxlength="30"><div class="row"><select id="cg">${o(['CS2','Valorant','CoD','Halo','LoL'])}</select><select id="cv">${o(['Chill','Competitive','Nostalgia','Beginner'])}</select></div><div class="row"><button id="mkgo">Create for 100 Frags</button><button id="mkx" class="ghost">Cancel</button></div></div>`}
function feed(){return `<h2 class="sec" style="margin-top:0">Feed</h2>
<div class="card"><textarea id="np" rows="2" placeholder="Looking for a squad? Share a clip? Post it."></textarea><div style="margin-top:8px"><button id="post">Post</button></div></div>
<div style="display:grid;gap:10px;margin-top:12px">${S.posts.map((p,i)=>`<div class="card post"><b>${p.u}</b><span>${p.t}</span>
<div><button class="ghost" data-l="${i}">${S.liked.includes(i)?'Liked':'Like'} (${p.l+(S.liked.includes(i)?1:0)})</button></div></div>`).join('')}</div>`}

function quests(){const done=S.claimed.length;return `<h2 class="sec" style="margin-top:0">Daily quests</h2>
<div class="bar"><i style="width:${done/QUESTS.length*100}%"></i></div><p class="mute">${done} of ${QUESTS.length} claimed. Frags buy badges, entries and merch discounts in the Shop.</p>
<div style="display:grid;gap:10px">${QUESTS.map(q=>{const c=S.claimed.includes(q.id),r=q.ok();return `<div class="card row" style="justify-content:space-between"><div><b>${q.t}</b><div class="mute">+${q.f} Frags</div></div>
<button data-q="${q.id}" ${c||!r?'disabled':''} class="${c?'ghost':''}">${c?'Claimed':r?'Claim':'Not done yet'}</button></div>`}).join('')}</div>`}

const FEAT=['2027 Esports Team Jersey','Redline Track Suit','Four Star Hoodie (Black)','Four Star 3D Snapback (Red)','Cybear XL Mouse Pad','Team Travel Duffel Bag','Radio Hoodie (Black)','Four Star Ceramic Mug'],SIC={"s1": "🚩", "s2": "🎖️", "s3": "🏆", "s5": "✨", "s6": "⭐", "s7": "🚀"};
function shop(){const F=FEAT.map(n=>MI.find(m=>m[0]===n)).filter(Boolean),d=bestPct();
return `<h2 class="sec" style="margin-top:0">Featured drops</h2><div class="fr">${F.map(m=>`<div class="card mc"><div class="mt"><img src="${m[5]}" alt="${m[0]}">${m[2]?'<span class="bdg">SALE</span>':''}</div><h3>${m[0]}</h3><div class="price">${d?`<s class="mute">$${m[1]}</s> $${(m[1]*(100-d)/100).toFixed(2)}`:m[2]?`<s class="mute">$${m[2]}</s> $${m[1]}`:'$'+m[1]}</div><button data-tab="merch">See all merch</button></div>`).join('')}</div>
<h2 class="sec">Perks</h2><div class="sg">${SHOP.filter(i=>i.id!=='s4').map(i=>{const b=S.bought.includes(i.id)&&!i.add;return `<div class="card st" title="${i.d}"><div class="ic">${SIC[i.id]||'🔥'}</div><b>${i.n}</b><span class="price">${i.f?i.f+' Frags':dp(i.usd)}</span><button data-b="${i.id}" ${b?'disabled':''}>${b?'Owned':i.f?'Buy':'Get'}</button></div>`}).join('')}</div>
${rewardsV()}`}

function vault(){return `<h2 class="sec" style="margin-top:0">Throwback vault</h2><p class="mute">For returning fans. Unlock each era to earn Frags and a lore card for new fans.</p>
<div class="tl">${VAULT.map(v=>{const u=S.unlocked.includes(v.y);return `<div class="card"><span class="yr">${v.y}</span> <b>${v.t}</b>
<p class="mute">${u?v.d:'Locked. Unlock to read this era and earn Frags.'}</p>
<button data-v="${v.y}" class="${u?'ghost':''}" ${u?'disabled':''}>${u?'Unlocked':'Unlock (+'+v.c+' Frags)'}</button></div>`}).join('')}</div>`}

function accounts(){return `<h2 class="sec" style="margin-top:0">Connect accounts</h2><p class="mute">Linking gives better squad matches. First link of each earns 100 Frags. This demo uses sample data.</p>
<div style="display:grid;gap:10px">${Object.entries(CONN).map(([k,c])=>`<div class="card conn ${S.conn[k]?'on':''}"><div class="row" style="justify-content:space-between"><div><b>${c.n}</b><div class="mute">${c.d}</div></div>

function eventsV(n){return `<h2 class='sec'>Happening at FaZe</h2><div class='recs'>${EV.slice(0,n||9).map(e=>`<div class='card ${e.live?'gold':''}'><span class='tag'>${e.w}${e.live?' · Upcoming':''}</span><h3>${e.t}</h3><p class='mute'>${e.d}</p>${e.live?`<div class='row'><button data-ev='${e.id}'>${S.wp?'In the watch party':'Join watch party'}</button><button class='ghost' data-tab='markets'>Predict it</button></div>`:''}</div>`).join('')}</div>`}
function myGames(){const g=new Set(SQUADS.filter(q=>S.joined.includes(q.id)).map(q=>q.g));if(S.conn.steam)g.add('CS2');if(S.conn.riot){g.add('Valorant');g.add('R6')}if(!g.size)g.add(S.fan==='new'?'CS2':'CoD');return g}
function welcomeV(){const on=FR.filter(f=>f.st!=='off').length,pl=FR.filter(f=>f.st==='game').length;return `<div class='wl'><div class='hl' style='width:90px;height:90px;margin:0 auto'></div><h1>Welcome to FaZe Lobby</h1><p class='mute'>Your friends, your squads and FaZe history in one place.</p><div class='card'><div class='mute'>Your FaZe Points (Frags)</div><div class='bal' style='font-size:44px;text-align:center'>${S.frags.toLocaleString()}</div><div class='mute'>${lvl()} · earn more with quests, lore and linking accounts</div></div><div class='card'><b>Link your accounts</b><div class='row' style='margin:8px 0'>${[['discord','Discord'],['steam','Steam'],['riot','Riot']].map(c=>`<button class='${S.conn[c[0]]?'ghost':''}' data-c='${c[0]}'>${S.conn[c[0]]?'✓ ':''}${c[1]}${S.conn[c[0]]?'':' +100'}</button>`).join('')}</div><div class='mute'>${on} friends online, ${pl} playing right now.</div></div>${eventsV(2)}<div class='card'><b>Who are you?</b><div class='row' style='margin-top:8px'><button data-fan='old'>Returning fan</button><button class='ghost' data-fan='new'>New to FaZe</button><button class='ghost' data-tab='friends'>Skip to friends</button></div></div></div>`}
function friendsV(){const G=myGames(),row=f=>`<div class='fr2 ${f.st}'><span class='dot'></span><div class='fi'><b>${f.n}</b><div class='mute'>${f.st==='game'?'🎮 '+f.g+' · ':''}${f.a} · ${f.p}</div></div><button class='${f.st==='game'?'':'ghost'}' data-fj='${FR.indexOf(f)}'>${f.st==='game'?'Join game':f.st==='on'?'Invite':'Ping'}</button></div>`,sec=(t,l)=>l.length?`<h2 class='sec'>${t} (${l.length})</h2><div class='fl'>${l.map(row).join('')}</div>`:'';
const sg=SUG.filter(s=>!S.added.includes(s.n)).map(s=>({s,k:s.pl.filter(x=>G.has(x)).length*10+s.m})).sort((a,b)=>b.k-a.k).slice(0,3);
return `<div class='card'><div class='row' style='justify-content:space-between'><div><h3>Friends</h3><div class='mute'>${FR.filter(f=>f.st==='game').length} playing · ${FR.filter(f=>f.st==='on').length} online · ${FR.filter(f=>f.st==='off').length} offline</div></div><div class='bal'>${S.frags.toLocaleString()}<small>FaZe Points</small></div></div><p class='mute'>Demo data. ${S.conn.discord?'Discord linked.':'Link Discord on the welcome page for live presence.'}</p></div>${sec('Playing now',FR.filter(f=>f.st==='game'))}${sec('Online',FR.filter(f=>f.st==='on'))}${sec('Offline',FR.filter(f=>f.st==='off'))}<h2 class='sec'>People you may like</h2><p class='mute'>Based on the games you play: ${[...G].join(', ')}.</p><div class='fl'>${sg.map(x=>`<div class='fr2 on'><span class='dot'></span><div class='fi'><b>${x.s.n}</b><div class='mute'>${x.s.pl.some(g=>G.has(g))?'You both play '+x.s.pl.filter(g=>G.has(g)).join(', '):'Plays '+x.s.pl.join(', ')} · ${x.s.m} mutual squads</div></div><button data-fa='${x.s.n}'>Add</button></div>`).join('')}</div>${eventsV(3)}`}
setInterval(()=>{if(S.tab==='friends'){const f=FR[rnd(FR.length)];if(f.st==='off'){f.st='on';f.a='Just came online'}else if(f.st==='on'){f.st='game';f.g=f.pl[0];f.a='Started playing '+f.g}else{f.st='on';f.g='';f.a='Online, idle'}render()}},9000);
S.hide=[];S.pref={};
function recs(){const R=[],em=S.fan==='old',gc={};SQUADS.filter(q=>S.joined.includes(q.id)).forEach(q=>gc[q.g]=(gc[q.g]||0)+1);const fav=Object.keys(gc).sort((a,b)=>gc[b]-gc[a])[0];
const nq=SQUADS.find(q=>!S.joined.includes(q.id)&&(fav?q.g===fav:em?q.v==='Nostalgia':true));
if(nq)R.push({id:'sq'+nq.id,k:'squad',t:nq.n,d:nq.d,why:fav?'You joined '+fav+' squads':em?'You came back for the nostalgia':'A good first squad',btn:'Join +20',a:'j',v:nq.id});
const last=S.read.length?TL[S.read[S.read.length-1]]:null,un=TL.map((t,i)=>[t,i]).filter(x=>!S.read.includes(x[1])),nx=(last&&un.find(x=>era(x[0][0])===era(last[0])))||un[0];
if(nx)R.push({id:'lo'+nx[1],k:'lore',t:nx[0][2],d:nx[0][3],why:last?'You just read about '+last[2]:'Start the story here',btn:'Read +5',a:'rl',v:nx[1]});
const re=em?/Victory|Flank|Stallions|Retro|Vintage/:/Jersey|Snapback|Hoodie/,mi=MI.find(m=>re.test(m[0])&&!m[4]);
if(mi)R.push({id:'me'+mi[0],k:'merch',t:mi[0],d:'$'+mi[1],img:mi[5],why:em?'Throwback pieces for returning fans':'Wear the brand',btn:'See merch',a:'tab',v:'merch'});
if(!Object.values(S.conn).some(Boolean))R.push({id:'acc',k:'acc',t:'Connect your accounts',d:'Better squad match % and 100 Frags per account.',why:'You have not linked any yet',btn:'Connect',a:'tab',v:'accounts'});
const pg=FR.filter(f=>f.st==='game');if(pg.length)R.push({id:'fr',k:'friend',t:pg.length+' friends playing now',d:pg.map(f=>f.n+' ('+f.g+')').join(', '),why:'Jump in with friends',btn:'See friends',a:'tab',v:'friends'});
R.push({id:'pred',k:'pred',t:'Call the live FaZe match',d:'Play-money predictions on a live simulated match.',why:'Follow FaZe esports',btn:'Open Predict',a:'tab',v:'markets'});
if(!S.plan)R.push({id:'plan',k:'plan',t:'Go Squad+',d:'More Frags, private squads, early drops.',why:S.frags>=500?'You are already Pro level':'Level up faster',btn:'See tiers',a:'tab',v:'plus'});
return R.filter(r=>!S.hide.includes(r.id)).sort((a,b)=>(S.pref[b.k]||0)-(S.pref[a.k]||0))}
function foryouV(){const R=recs().slice(0,5),pct=Math.min(100,Math.round(S.frags/15));return `<div class='card'><div class='row' style='justify-content:space-between'><div><h3>${S.fan==='old'?'Welcome back':S.fan==='new'?'Welcome to FaZe':'Your lobby'}</h3><div class='mute'>${lvl()} · ${S.frags} Frags</div></div><button class='ghost' data-tab='quests'>Daily quests</button></div><div class='bar'><i style='width:${pct}%'></i></div></div><h2 class='sec'>Picked for you</h2><p class='mute'>Based on what you do here. Tap 👍 or 👎 and the picks adapt.</p><div class='recs'>${R.map(r=>`<div class='card rc'>${r.img?`<img src='${r.img}' alt=''>`:''}<div><span class='tag'>${r.why}</span><h3>${r.t}</h3><p class='mute'>${r.d}</p><div class='row'><button data-ra='${r.id}'>${r.btn}</button><button class='ghost' data-rf='${r.id}|1' aria-label='More like this'>👍</button><button class='ghost' data-rf='${r.id}|0' aria-label='Not for me'>👎</button></div></div></div>`).join('')||'<p class="mute">You are all caught up.</p>'}</div>`}
function fanbar(){return S.fan||S.tab!=='foryou'?'':`<div class='card gold' style='margin-bottom:14px'><h3>Welcome to the lobby. Who are you?</h3><p class='mute'>Pick a path. You get 25 Frags and start in the right place.</p><div class='row'><button data-fan='old'>I'm a returning fan</button><button class='ghost' data-fan='new'>I'm new to FaZe</button></div></div>`}
const hero=()=>hero0()+fanbar();
function pitchV(){const C=(h,b)=>`<div class='card'><h3>${h}</h3><p class='mute'>${b}</p></div>`;return `<h2 class='sec' style='margin-top:0'>The pitch</h2><p class='mute'>FaZe Lobby: a home where returning fans relive the lore and new fans find their squad.</p><div class='grid'>${[
['User problem','FaZe\u2019s story is scattered across YouTube, TikTok, Instagram, Twitch and X. Returning fans have no single place to come back together, and new fans meet 15 years of history with no guide. Hype has to be rebuilt, not just announced.'],
['Who it is for','<b>Returning fans</b>: nostalgia, an OG badge, reunion squads.<br><b>New fans</b>: a guided lore path and squads built around the games they play.<br>One switch on first open sends each to the right place.'],
['Proposed experience','Relive (timeline and vault), Belong (squads matched by game and vibe), Earn (Frags from quests, lore and connecting accounts), Spend (merch codes, perks, cups). Each loop feeds the next.'],
['Priority 1: built','Fan path, timeline with lore quests, throwback vault, squads you create free, Frags, merch with real products, Squad+ tiers and season pass.'],
['Priority 2: next','A small backend for real Steam, Discord and Riot sign-in, live match and stream data for FaZe Esports, creator and sponsor quest tools, real checkout.'],
['Priority 3: later','Play-money Predict and Arcade (18+, no cash-out) as engagement hooks. They are not the core and come after the community and nostalgia loops prove out.'],
['Why it resonates','FaZe\u2019s best moments were participatory: community montages, #FAZE5, the Clash of the Clan. This turns that into a product. Esports titles (CS2, Rainbow Six, Call of Duty) give new fans a reason to care now; the history gives returning fans a reason to come back.'],
['How it earns','Squad+ tiers, season pass, cosmetics, tournament entries and tips from fans. Sponsors pay per brand quest and per drop. Merch earns on every sale and Frag discount codes drive repeat buying. Frags cannot be bought with cash.'],
['Feasibility: real vs demo','Real in this MVP: all UI, Frags, quests, squads, timeline, merch data. Demo only: the account connections, checkout and match feed. Next step is one small backend that holds the keys.'],
['What to measure','Returning-fan reactivation, squads joined per new fan, 7-day return rate, quest completion, Squad+ attach rate, merch click-through.']].map(x=>C(x[0],x[1])).join('')}</div>`}
function bindM(){$('#main').querySelectorAll('[data-fj]').forEach(b=>b.onclick=()=>{const f=FR[+b.dataset.fj];S.fjd=S.fjd||[];if(f.st==='game'){toast('Joining '+f.n+' in '+f.g+'...');if(!S.fjd.includes(f.n)){S.fjd.push(f.n);add(10)}}else toast(f.st==='on'?'Invite sent to '+f.n:'Ping sent. We will tell you when '+f.n+' is online')});$('#main').querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>{const s=SUG.find(x=>x.n===b.dataset.fa);S.added.push(s.n);FR.unshift({n:s.n,st:'on',g:'',a:'Online, idle',p:'Discord',pl:s.pl});toast('Friend request sent to '+s.n+'. +10 Frags');add(10)});$('#main').querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{if(S.wp){toast('You are already in the watch party');return}S.wp=1;toast('You are in the watch party. +10 Frags');add(10)});$('#main').querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{const r=recs().find(x=>x.id===b.dataset.ra);if(!r)return;S.pref[r.k]=(S.pref[r.k]||0)+1;if(r.a==='j'){S.joined.push(r.v);toast('Joined. +20 Frags');add(20)}else if(r.a==='rl'){S.read.push(r.v);toast('+5 Frags');add(5)}else{S.tab=r.v;render();scrollTo(0,0)}});$('#main').querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{const[id,y]=b.dataset.rf.split('|'),r=recs().find(x=>x.id===id);if(!r)return;if(+y){S.pref[r.k]=(S.pref[r.k]||0)+2;toast('Got it, more like this')}else{S.hide.push(id);S.pref[r.k]=(S.pref[r.k]||0)-1;toast('Okay, fewer like this')}render()});$('#main').querySelectorAll('[data-fan]').forEach(b=>b.onclick=()=>{S.fan=b.dataset.fan;S.tab='foryou';toast(S.fan==='old'?'Welcome back. +25 Frags':'Welcome to FaZe. +25 Frags');add(25)});$('#main').querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>{S.read.push(+b.dataset.rl);toast('+5 Frags');add(5)});$('#main').querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>{S.te=+b.dataset.te;render()});$('#main').querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{S.plan=b.dataset.plan;toast('Checkout would open here (Stripe). Demo activates '+S.plan);render()});$('#main').querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{S.mc=b.dataset.mc;render()})}
const V={welcome:welcomeV,friends:friendsV,foryou:foryouV,timeline:timelineV,plus:plusV,squads,feed,quests,markets,shop,merch:merchV,vault,accounts};
const earned={};
function render(){
$('#bal').textContent=S.frags.toLocaleString();$('#lvl').textContent=lvl();tabs();document.body.dataset.w=S.tab==='welcome'?'1':'';
const keep=document.activeElement&&document.activeElement.id==='q';
$('#main').innerHTML=hero()+V[S.tab]();bindM();bind();bind2();bind3();live();
if(keep){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}}

function bind(){
const m=$('#main');
m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.game=b.dataset.g;render()});
const q=$('#q');if(q)q.oninput=()=>{S.q=q.value;render()};
const mk=$('#mk');if(mk)mk.onclick=()=>{S.open=true;render()};const mx=$('#mkx');if(mx)mx.onclick=()=>{S.open=false;render()};
const go=$('#mkgo');if(go)go.onclick=()=>{const n=$('#cn').value.trim();if(!n){toast('Name your squad first');return}SQUADS.unshift({id:Date.now(),n,g:$('#cg').value,r:'Any',v:$('#cv').value,m:0,d:'Created by you.',mine:1,code:'FAZE-'+Math.random().toString(36).slice(2,6).toUpperCase()});S.joined.push(SQUADS[0].id);S.open=false;toast('Your crew is live');render()};
m.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const id=+b.dataset.j;if(S.joined.includes(id)){S.joined=S.joined.filter(x=>x!==id);render()}else{S.joined.push(id);toast('Joined. +20 Frags');add(20)}});
const p=$('#post');if(p)p.onclick=()=>{const t=$('#np').value.trim();if(!t){toast('Write something first');return}S.posts.unshift({u:'You',t,l:0});S.liked=S.liked.map(i=>i+1);render()};
m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(S.liked.includes(i))S.liked=S.liked.filter(x=>x!==i);else S.liked.push(i);render()});
m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=QUESTS.find(x=>x.id===b.dataset.q);S.claimed.push(q.id);toast('+'+q.f+' Frags');add(q.f)});
m.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=SHOP.find(x=>x.id===b.dataset.b);
if(i.f){if(S.frags<i.f){toast('Need '+(i.f-S.frags)+' more Frags. Try a quest.');return}S.bought.push(i.id);toast('Bought '+i.n);add(-i.f)}
else{if(i.add){toast('Checkout would open here (Stripe). Demo adds '+i.add+' Frags.');add(i.add)}else{S.bought.push(i.id);toast('Checkout would open here (Stripe).');render()}}});
m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=VAULT.find(x=>x.y===+b.dataset.v);S.unlocked.push(v.y);toast('+'+v.c+' Frags');add(v.c)});
m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;S.conn[k]=!S.conn[k];if(S.conn[k]&&!earned[k]){earned[k]=1;toast(CONN[k].n+' connected. +100 Frags');add(100)}else render()});
}
render();
</script>
</body>
